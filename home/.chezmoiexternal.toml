# Repos provisioned by chezmoi on `apply`, kept out of this repo so they stay
# independently versioned upstream. refreshPeriod limits how often chezmoi re-pulls.

# Cloned over SSH (unlike the third-party repos below) because this one is ours
# and we push to it. Each machine registers its own key with GitHub before
# bootstrap runs, so the key is always present by the time chezmoi clones.
[".config/nvim"]
    type = "git-repo"
    url = "git@github.com:QuantumDancer/astronvim_config.git"
    refreshPeriod = "168h"

[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"
